[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ammsim"
version = "1.0.0"
description = "Automated market makers vs limit order books: a Monte Carlo study of LP returns, optimal fees and sandwich attacks"
authors = [{ name = "Madhav Kumar" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
